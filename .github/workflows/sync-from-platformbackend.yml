name: Sync from PlatformBackend

on:
  repository_dispatch:
    types: [platform-contracts-updated]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full PlatformBackend commit SHA
        required: true
        type: string
      services:
        description: Comma-separated service aliases, or all
        default: all
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: platform-contract-sync
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Resolve source request
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.event.client_payload.source_sha }}
          MANUAL_SHA: ${{ inputs.source_sha }}
          EVENT_SERVICES: ${{ toJson(github.event.client_payload.changed_services) }}
          MANUAL_SERVICES: ${{ inputs.services }}
          SYNC_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          test -n "$SYNC_TOKEN" || { echo "::error::BOT_GITHUB_TOKEN is required to open a PR and trigger CI."; exit 1; }
          sha="$EVENT_SHA"
          services="$MANUAL_SERVICES"
          if [ "$EVENT_NAME" = repository_dispatch ]; then
            services=$(jq -er 'if type == "array" then join(",") elif type == "string" then . else error("Missing changed_services") end' <<<"$EVENT_SERVICES")
          else
            sha="$MANUAL_SHA"
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::A full PlatformBackend source SHA is required."
            exit 1
          fi
          if ! [[ "$services" =~ ^[a-z0-9_-]+(,[a-z0-9_-]+)*$ ]]; then
            echo "::error::Expected comma-separated service aliases."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "services=$services" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          repository: AceDataCloud/PlatformBackend
          ref: ${{ steps.source.outputs.sha }}
          path: _platformbackend
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
      - run: pip install ruff

      - name: Refresh pinned specifications and generate all three SDKs
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SERVICES: ${{ steps.source.outputs.services }}
        run: |
          test "$(git -C _platformbackend rev-parse HEAD)" = "$SOURCE_SHA"
          python3 scripts/sync_from_platformbackend.py --backend-dir _platformbackend --services "$SERVICES"
          python3 scripts/generate_providers.py --manifest scripts/services.json --specs scripts/specs --languages python,typescript,go
          git diff --check

      - name: Open a reviewable generated PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          branch: codex/sync-platform-${{ steps.source.outputs.sha }}
          author: Ace Data Cloud Dev <dev@acedata.cloud>
          committer: Ace Data Cloud Dev <dev@acedata.cloud>
          commit-message: "chore: regenerate SDK from PlatformBackend contracts"
          title: "sync: SDK contracts from PlatformBackend ${{ steps.source.outputs.sha }}"
          draft: true
          add-paths: |
            scripts/specs/*.json
            python/src/acedatacloud/
            typescript/src/
            go/*.go
          body: |
            Regenerated the existing provider clients from [PlatformBackend source](https://github.com/AceDataCloud/PlatformBackend/tree/${{ steps.source.outputs.sha }}).

            Requested services: `${{ steps.source.outputs.services }}`.

            Review API compatibility, new endpoints not yet in `scripts/services.json`, and the hand-written Kling, OpenAI, Serp, ShortURL, WebExtrator and Veo clients before marking ready. Those clients are not rewritten by the generator. Normal Python, TypeScript and Go CI must pass before merge. This workflow does not merge or close other PRs.
