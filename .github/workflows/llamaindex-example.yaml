name: LlamaIndex Example

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/examples/llamaindex
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Verify published SDK and LlamaIndex workflow offline
        run: |
          python workflow.py
          python -m pytest -q
