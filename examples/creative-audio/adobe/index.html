<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ace Media</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main>
    <details id="media" open>
      <summary><img src="icons/ace-media.png" alt="" width="24" height="24" style="vertical-align: middle"> Import a media task</summary>
      <form>
        <label>Media service <img data-service-icon src="icons/suno.png" alt="" width="24" height="24" style="vertical-align: middle"> <select name="service"></select></label>
        <label>Application token <input name="token" type="password" autocomplete="off" required></label>
        <a id="media-application-link" href="https://platform.acedata.cloud/console/applications?utm_source=adobe-express&amp;utm_medium=referral&amp;utm_campaign=evergreen" target="_blank" rel="noopener noreferrer">Get an application token</a>
        <label>Existing task ID <input name="task" type="text" autocomplete="off" required></label>
        <button type="submit">Find media</button>
      </form>
      <p role="status" aria-live="polite"></p>
      <section></section>
    </details>
    <details><summary><img src="icons/acemusic.png" alt="" width="24" height="24" style="vertical-align: middle"> ACE Music tracks and generation</summary><div id="tasks"></div></details>
    <section aria-label="Free sample">
      <strong>Studio chimes · free sample</strong>
      <audio id="sample-player" controls preload="none" src="studio-chimes.mp3"></audio>
      <button id="add-sample" type="button">Add sample to design</button>
      <p id="sample-status" aria-live="polite"></p>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
