[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acedatacloud"
version = "0.1.0"
description = "Ace Data Cloud Python SDK for Suno, Seedance, HappyHorse, GPT Image and Nano Banana"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Ace Data Cloud", email = "support@acedata.cloud" }]
maintainers = [{ name = "Ace Data Cloud", email = "support@acedata.cloud" }]
keywords = ["acedatacloud", "ai", "suno", "seedance", "happyhorse", "gpt-image", "nano-banana", "sdk"]

dependencies = [
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/AceDataCloud/SDK"
Repository = "https://github.com/AceDataCloud/SDK"
Issues = "https://github.com/AceDataCloud/SDK/issues"
Documentation = "https://github.com/AceDataCloud/SDK/blob/main/python/README.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.21",
    "ruff>=0.4.0",
]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.21",
    "pytest-cov>=4.0",
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/acedatacloud"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
